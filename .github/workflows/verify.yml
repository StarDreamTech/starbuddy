name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: 截取星芽预览
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          for i in $(seq 30); do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node scripts/screenshot.mjs http://127.0.0.1:4173/ starpet-preview.png
      - uses: actions/upload-artifact@v4
        with:
          name: starbuddy-preview
          path: |
            starpet-preview.png
            dist/
